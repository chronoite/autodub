[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autodub"
version = "0.2.0"
description = "Experimental local, human-in-the-loop Japanese-to-English anime dubbing pipeline (personal research project)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
keywords = ["anime", "dubbing", "tts", "voice-cloning", "whisper", "speaker-diarization", "translation", "offline"]
authors = [{ name = "Collin Loy" }]
requires-python = ">=3.11"
# The orchestrator, HTTP server and web UI use only the standard library. Model inference runs in
# separate worker environments; see requirements/ and docs/SETUP.md.
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
]

[project.optional-dependencies]
download = ["huggingface_hub>=0.25"]
test = ["numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/chronoite/autodub"
Repository = "https://github.com/chronoite/autodub"
Documentation = "https://github.com/chronoite/autodub/tree/main/docs"
Issues = "https://github.com/chronoite/autodub/issues"

[project.scripts]
autodub = "autodub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autodub = ["web/static/*", "experiments/*.json", "experiments/README.md"]
